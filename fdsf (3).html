<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>ICEGames</title>

        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: radial-gradient(
                    circle at center,
                    #0ff 0%,
                    #001018 65%
                );
                font-family: "Segoe UI", Arial, sans-serif;
                color: cyan;
            }

            /* ===== BACKGROUND DEPTH ===== */
            .layer {
                position: absolute;
                width: 300%;
                height: 300%;
                top: -100%;
                left: -100%;
                pointer-events: none;
            }

            .layer.one {
                background: repeating-linear-gradient(
                    45deg,
                    rgba(255, 255, 255, 0.03),
                    rgba(255, 255, 255, 0.03) 14px,
                    transparent 14px,
                    transparent 28px
                );
                animation: driftSlow 140s linear infinite;
            }

            .layer.two {
                background: repeating-linear-gradient(
                    -45deg,
                    rgba(255, 255, 255, 0.02),
                    rgba(255, 255, 255, 0.02) 10px,
                    transparent 10px,
                    transparent 20px
                );
                animation: driftFast 80s linear infinite;
            }

            @keyframes driftSlow {
                to {
                    transform: translate(-40%, -40%);
                }
            }
            @keyframes driftFast {
                to {
                    transform: translate(40%, 40%);
                }
            }

            /* ===== CENTER STAGE ===== */
            .stage {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 5;
            }

            /* ===== LOGO ===== */
            .logo-wrap {
                text-align: center;
                perspective: 800px;
            }

            /* Letter container */
            .logo {
                display: flex;
                font-size: 110px;
                font-weight: 900;
                letter-spacing: 6px;
            }

            /* Individual letter */
            .letter {
                display: inline-block;
                position: relative;
                color: cyan;
                text-shadow:
                    0 0 20px cyan,
                    0 0 60px rgba(0, 255, 255, 0.9);
                animation:
                    floatWave 4s ease-in-out infinite,
                    glowPulse 3s ease-in-out infinite;
            }

            /* Make "Games" white */
            .letter.white {
                color: white;
                text-shadow:
                    0 0 20px white,
                    0 0 60px rgba(255, 255, 255, 0.8);
            }

            @keyframes floatWave {
                0%,
                100% {
                    transform: translateY(0) rotateX(0deg);
                }
                50% {
                    transform: translateY(-22px) rotateX(10deg);
                }
            }

            @keyframes glowPulse {
                0%,
                100% {
                    filter: brightness(1);
                }
                50% {
                    filter: brightness(1.6);
                }
            }

            /* ===== SHIMMER SCAN ===== */
            .letter::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    120deg,
                    transparent 30%,
                    rgba(255, 255, 255, 0.8),
                    transparent 70%
                );
                opacity: 0;
                animation: shimmer 5s infinite;
            }

            @keyframes shimmer {
                0% {
                    opacity: 0;
                    transform: translateX(-100%);
                }
                20% {
                    opacity: 0.8;
                }
                40% {
                    opacity: 0;
                    transform: translateX(100%);
                }
            }

            /* ===== SUBTITLE ===== */
            .subtitle {
                font-size: 28px;
                margin-top: 16px;
                opacity: 0.85;
            }

            /* ===== ENTER BUTTON ===== */
            .enter {
                display: inline-block;
                margin-top: 50px;
                padding: 16px 50px;
                border-radius: 40px;
                font-size: 22px;
                border: 2px solid cyan;
                color: cyan;
                text-decoration: none;
                box-shadow: 0 0 30px cyan;
                transition: 0.3s;
            }

            .enter:hover {
                background: cyan;
                color: black;
                box-shadow: 0 0 90px cyan;
            }

            /* ===== ICE SHARDS ===== */
            .shard {
                position: absolute;
                width: 12px;
                height: 34px;
                background: linear-gradient(
                    to bottom,
                    rgba(200, 255, 255, 0.9),
                    rgba(0, 255, 255, 0.15)
                );
                clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
                box-shadow: 0 0 25px cyan;
                pointer-events: none;
            }
        </style>
    </head>

    <body>
        <div class="layer one"></div>
        <div class="layer two"></div>

        <div class="stage">
            <div class="logo-wrap">
                <div class="logo" id="logo">
                    <!-- Letters inserted by JS -->
                </div>

                <div class="subtitle">GameStation</div>
                <a class="enter" href="index.html">Enter the Ice</a>
            </div>
        </div>

        <script>
            /* ===== BUILD LOGO LETTER BY LETTER ===== */
            const text = "ICEGames";
            const logo = document.getElementById("logo");

            [...text].forEach((char, i) => {
                const span = document.createElement("span");
                span.className = "letter" + (i >= 3 ? " white" : "");
                span.textContent = char;

                span.style.animationDelay = `${i * 0.15}s`;
                span.style.setProperty("--i", i);

                logo.appendChild(span);
            });

            /* ===== ICE SHARDS ===== */
            for (let i = 0; i < 80; i++) {
                const s = document.createElement("div");
                s.className = "shard";
                reset(s);
                document.body.appendChild(s);
                animate(s);
            }

            function reset(s) {
                s.x = Math.random() * window.innerWidth;
                s.y = Math.random() * window.innerHeight;
                s.speed = 0.4 + Math.random() * 2;
                s.rot = Math.random() * 360;
                s.scale = 0.5 + Math.random();
            }

            function animate(s) {
                function move() {
                    s.y += s.speed;
                    s.rot += 0.4;
                    if (s.y > window.innerHeight + 40) {
                        s.y = -40;
                        s.x = Math.random() * window.innerWidth;
                    }
                    s.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.rot}deg) scale(${s.scale})`;
                    requestAnimationFrame(move);
                }
                move();
            }

            /* ===== PARALLAX CAMERA ===== */
            document.addEventListener("mousemove", (e) => {
                const x = (e.clientX / innerWidth - 0.5) * 40;
                const y = (e.clientY / innerHeight - 0.5) * 40;
                document.querySelector(".logo-wrap").style.transform =
                    `translate(${x}px, ${y}px)`;
            });
        </script>
    </body>
</html>
