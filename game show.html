<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Game Player | ICEGames</title>
        <style>
            :root {
                --cyber-blue: #00ffff;
                --deep-blue: #001122;
                --neon-glow: 0 0 20px #00ffff, 0 0 40px #00ffff;
                --ice-gradient: linear-gradient(
                    135deg,
                    #00ffff,
                    #00ccff,
                    #0099ff
                );
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: "Arial", sans-serif;
                background: #000;
                color: white;
                min-height: 100vh;
                overflow-x: hidden;
            }

            /* 🌌 ANIMATED BACKGROUND */
            .game-background {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: -1;
                background: linear-gradient(
                    45deg,
                    #000810 0%,
                    #001122 25%,
                    #002244 50%,
                    #003366 75%,
                    #004488 100%
                );
                background-size: 400% 400%;
                animation: backgroundShift 20s ease infinite;
            }

            @keyframes backgroundShift {
                0% {
                    background-position: 0% 0%;
                }
                50% {
                    background-position: 100% 100%;
                }
                100% {
                    background-position: 0% 0%;
                }
            }

            /* ❄️ FLOATING ICE PARTICLES */
            .ice-particle {
                position: fixed;
                background: var(--cyber-blue);
                border-radius: 50%;
                pointer-events: none;
                opacity: 0.6;
                filter: blur(1px);
                z-index: -1;
                animation: floatParticle linear infinite;
            }

            @keyframes floatParticle {
                0% {
                    transform: translateY(110vh) rotate(0deg);
                }
                100% {
                    transform: translateY(-10vh) rotate(360deg);
                }
            }

            /* 🎮 HEADER */
            .game-header {
                background: rgba(0, 20, 40, 0.9);
                backdrop-filter: blur(10px);
                padding: 20px 40px;
                border-bottom: 2px solid rgba(0, 255, 255, 0.3);
                box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
                position: relative;
                z-index: 100;
                transition: all 0.3s ease;
            }

            .fullscreen-mode .game-header {
                opacity: 0;
                pointer-events: none;
                transform: translateY(-100%);
            }

            .header-content {
                max-width: 1400px;
                margin: 0 auto;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 20px;
            }

            .game-title {
                font-size: 32px;
                font-weight: bold;
                background: var(--ice-gradient);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            }

            /* 🎛 CONTROL BUTTONS */
            .control-buttons {
                display: flex;
                gap: 15px;
                flex-wrap: wrap;
            }

            .control-btn {
                padding: 12px 25px;
                background: rgba(0, 255, 255, 0.1);
                border: 2px solid rgba(0, 255, 255, 0.3);
                color: var(--cyber-blue);
                border-radius: 10px;
                cursor: pointer;
                font-weight: bold;
                font-size: 16px;
                transition: all 0.3s ease;
                display: flex;
                align-items: center;
                gap: 8px;
                text-decoration: none;
            }

            .control-btn:hover {
                background: rgba(0, 255, 255, 0.2);
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(0, 255, 255, 0.4);
                border-color: var(--cyber-blue);
            }

            .fullscreen-btn {
                background: var(--ice-gradient);
                color: #001122;
                border: none;
            }

            .fullscreen-btn:hover {
                background: linear-gradient(135deg, #00ffff, #00ccff);
                color: #001122;
            }

            /* 🎯 GAME CONTAINER */
            .game-container {
                max-width: 1200px;
                margin: 40px auto;
                padding: 0 20px;
                transition: all 0.3s ease;
            }

            .fullscreen-mode .game-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                margin: 0;
                padding: 0;
                max-width: none;
                z-index: 999;
                background: #000;
            }

            .game-wrapper {
                background: rgba(0, 20, 40, 0.7);
                border-radius: 20px;
                padding: 30px;
                border: 2px solid rgba(0, 255, 255, 0.2);
                box-shadow:
                    0 0 50px rgba(0, 255, 255, 0.3),
                    inset 0 0 30px rgba(0, 255, 255, 0.1);
                position: relative;
                overflow: hidden;
                transition: all 0.3s ease;
            }

            .fullscreen-mode .game-wrapper {
                width: 100%;
                height: 100%;
                border-radius: 0;
                border: none;
                padding: 0;
                box-shadow: none;
            }

            .game-wrapper::before {
                content: "";
                position: absolute;
                top: -2px;
                left: -2px;
                right: -2px;
                bottom: -2px;
                background: linear-gradient(
                    45deg,
                    #00ffff,
                    #00ccff,
                    #0099ff,
                    #00ffff
                );
                border-radius: 22px;
                z-index: -1;
                opacity: 0.5;
                filter: blur(10px);
            }

            .fullscreen-mode .game-wrapper::before {
                display: none;
            }

            /* 🎮 GAME FRAME */
            .game-frame-container {
                position: relative;
                margin: 0 auto;
                max-width: 900px;
                background: #000;
                border-radius: 10px;
                overflow: hidden;
                border: 3px solid rgba(0, 255, 255, 0.5);
                box-shadow:
                    0 0 40px rgba(0, 255, 255, 0.5),
                    inset 0 0 20px rgba(0, 255, 255, 0.1);
                transition: all 0.3s ease;
            }

            .fullscreen-mode .game-frame-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                max-width: none;
                border-radius: 0;
                border: none;
                box-shadow: none;
                margin: 0;
            }

            .game-frame {
                width: 100%;
                height: 600px;
                border: none;
                display: block;
                background: #000;
                transition: all 0.3s ease;
            }

            .fullscreen-mode .game-frame {
                width: 100%;
                height: 100%;
                max-width: none;
            }

            /* 📊 GAME INFO */
            .game-info {
                margin-top: 30px;
                padding: 25px;
                background: rgba(0, 30, 50, 0.5);
                border-radius: 15px;
                border: 1px solid rgba(0, 255, 255, 0.2);
                transition: all 0.3s ease;
            }

            .fullscreen-mode .game-info {
                opacity: 0;
                pointer-events: none;
                transform: translateY(100%);
                position: fixed;
                bottom: -100%;
            }

            .info-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
                gap: 20px;
                margin-top: 20px;
            }

            .info-card {
                background: rgba(0, 40, 60, 0.4);
                padding: 20px;
                border-radius: 10px;
                border-left: 4px solid var(--cyber-blue);
            }

            .info-card h3 {
                color: var(--cyber-blue);
                margin-bottom: 10px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

            /* ⭐ RATING */
            .rating {
                display: flex;
                gap: 5px;
                margin: 10px 0;
            }

            .star {
                color: #ffd700;
                font-size: 20px;
                text-shadow: 0 0 10px gold;
            }

            /* 🎛 GAME CONTROLS INFO */
            .controls-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
                gap: 15px;
                margin-top: 15px;
            }

            .control-item {
                background: rgba(0, 255, 255, 0.1);
                padding: 10px;
                border-radius: 8px;
                text-align: center;
                border: 1px solid rgba(0, 255, 255, 0.2);
            }

            .key {
                display: inline-block;
                background: rgba(0, 0, 0, 0.6);
                padding: 5px 10px;
                border-radius: 5px;
                border: 1px solid var(--cyber-blue);
                color: var(--cyber-blue);
                font-family: monospace;
                margin: 0 3px;
            }

            /* 📱 RESPONSIVE DESIGN */
            @media (max-width: 768px) {
                .game-header {
                    padding: 15px 20px;
                }

                .header-content {
                    flex-direction: column;
                    text-align: center;
                }

                .game-title {
                    font-size: 24px;
                }

                .game-frame {
                    height: 400px;
                }

                .control-buttons {
                    justify-content: center;
                }
            }

            @media (max-width: 480px) {
                .game-frame {
                    height: 300px;
                }

                .control-btn {
                    padding: 10px 15px;
                    font-size: 14px;
                }
            }

            /* 🚀 FULLSCREEN CONTROLS */
            .fullscreen-controls {
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 1000;
                display: flex;
                gap: 10px;
                opacity: 0;
                transform: translateY(-20px);
                transition: all 0.3s ease;
            }

            .fullscreen-mode .fullscreen-controls {
                opacity: 1;
                transform: translateY(0);
            }

            .fullscreen-control-btn {
                padding: 10px 20px;
                background: rgba(0, 0, 0, 0.7);
                color: var(--cyber-blue);
                border: 2px solid rgba(0, 255, 255, 0.5);
                border-radius: 8px;
                cursor: pointer;
                font-weight: bold;
                backdrop-filter: blur(10px);
                transition: all 0.3s ease;
            }

            .fullscreen-control-btn:hover {
                background: rgba(0, 255, 255, 0.2);
                transform: scale(1.1);
            }

            /* 🎯 LOADING ANIMATION */
            .loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: #000;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                z-index: 9999;
                transition: opacity 0.5s ease;
            }

            .loader {
                width: 80px;
                height: 80px;
                border: 5px solid rgba(0, 255, 255, 0.1);
                border-top: 5px solid var(--cyber-blue);
                border-radius: 50%;
                animation: spin 1s linear infinite;
                box-shadow: 0 0 30px var(--cyber-blue);
            }

            .loading-text {
                margin-top: 20px;
                color: var(--cyber-blue);
                font-size: 18px;
                animation: pulse 1.5s ease-in-out infinite;
            }

            @keyframes spin {
                0% {
                    transform: rotate(0deg);
                }
                100% {
                    transform: rotate(360deg);
                }
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.5;
                }
                50% {
                    opacity: 1;
                }
            }

            /* 🔥 SPECIAL EFFECTS */
            .cyber-line {
                height: 2px;
                background: linear-gradient(
                    90deg,
                    transparent,
                    var(--cyber-blue),
                    transparent
                );
                margin: 20px 0;
                animation: lineGlow 2s ease-in-out infinite;
            }

            .fullscreen-mode .cyber-line {
                display: none;
            }

            @keyframes lineGlow {
                0%,
                100% {
                    opacity: 0.3;
                }
                50% {
                    opacity: 1;
                }
            }

            /* 🎮 GAME STATS */
            .stats-bar {
                display: flex;
                gap: 20px;
                margin-top: 20px;
                flex-wrap: wrap;
            }

            .fullscreen-mode .stats-bar {
                display: none;
            }

            .stat-item {
                flex: 1;
                min-width: 150px;
                background: rgba(0, 255, 255, 0.1);
                padding: 15px;
                border-radius: 10px;
                text-align: center;
                border: 1px solid rgba(0, 255, 255, 0.2);
            }

            .stat-value {
                font-size: 24px;
                font-weight: bold;
                color: var(--cyber-blue);
                text-shadow: 0 0 10px var(--cyber-blue);
            }

            .stat-label {
                font-size: 14px;
                color: #88ffff;
                margin-top: 5px;
            }

            /* 🔊 VOLUME CONTROL */
            .volume-control {
                display: none;
                align-items: center;
                gap: 10px;
                margin-left: 15px;
            }

            .fullscreen-mode .volume-control {
                display: flex;
            }

            .volume-slider {
                width: 100px;
                -webkit-appearance: none;
                height: 6px;
                background: rgba(0, 255, 255, 0.2);
                border-radius: 3px;
                outline: none;
            }

            .volume-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                background: var(--cyber-blue);
                cursor: pointer;
                box-shadow: 0 0 10px var(--cyber-blue);
            }

            /* 📱 MOBILE FULLSCREEN */
            @media (orientation: landscape) and (max-height: 500px) {
                .fullscreen-mode .game-frame {
                    height: 100vh;
                }
            }

            /* 🎮 FULLSCREEN MESSAGE */
            .fullscreen-message {
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.8);
                color: var(--cyber-blue);
                padding: 10px 20px;
                border-radius: 10px;
                border: 2px solid var(--cyber-blue);
                opacity: 0;
                z-index: 1000;
                font-weight: bold;
                transition: opacity 0.3s ease;
                pointer-events: none;
            }

            .fullscreen-message.show {
                opacity: 1;
                animation: fadeInOut 3s ease-in-out;
            }

            @keyframes fadeInOut {
                0%,
                100% {
                    opacity: 0;
                }
                10%,
                90% {
                    opacity: 1;
                }
            }
        </style>
    </head>
    <body>

        <script>
            // ========== FIXED FULLSCREEN FUNCTIONALITY ==========

            let isFullscreen = false;
            let isMuted = false;
            let volume = 100;

            // Create ice particles
            function createIceParticles() {
                const container = document.getElementById("iceParticles");
                for (let i = 0; i < 30; i++) {
                    const particle = document.createElement("div");
                    particle.className = "ice-particle";

                    const size = Math.random() * 5 + 2;
                    const left = Math.random() * 100;
                    const duration = 5 + Math.random() * 15;
                    const delay = Math.random() * 5;

                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${left}vw`;
                    particle.style.animationDuration = `${duration}s`;
                    particle.style.animationDelay = `${delay}s`;
                    particle.style.opacity = 0.3 + Math.random() * 0.4;

                    container.appendChild(particle);
                }
            }

            // Fullscreen toggle function
            function toggleFullscreen() {
                const gameContainer = document.querySelector(".game-container");
                const body = document.body;

                if (!isFullscreen) {
                    // Enter fullscreen
                    body.classList.add("fullscreen-mode");
                    isFullscreen = true;
                    document.getElementById("fullscreenBtn").innerHTML =
                        "⛶ Exit Fullscreen";

                    // Show fullscreen message
                    const message =
                        document.getElementById("fullscreenMessage");
                    message.classList.add("show");
                    setTimeout(() => {
                        message.classList.remove("show");
                    }, 3000);

                    // Lock orientation on mobile
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock("landscape").catch(() => {
                            console.log("Orientation lock not supported");
                        });
                    }

                    // Hide scrollbars
                    document.documentElement.style.overflow = "hidden";
                    document.body.style.overflow = "hidden";
                } else {
                    // Exit fullscreen
                    body.classList.remove("fullscreen-mode");
                    isFullscreen = false;
                    document.getElementById("fullscreenBtn").innerHTML =
                        "⛶ Fullscreen";

                    // Restore orientation
                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }

                    // Restore scroll
                    document.documentElement.style.overflow = "";
                    document.body.style.overflow = "";
                }
            }

            // Mute toggle function
            function toggleMute() {
                isMuted = !isMuted;
                const muteBtn = document.getElementById("muteBtn");
                const fullscreenMuteBtn =
                    document.getElementById("fullscreenMuteBtn");

                if (isMuted) {
                    muteBtn.innerHTML = "🔇 Sound: OFF";
                    fullscreenMuteBtn.innerHTML = "🔇 Unmute";
                    volume = 0;
                    document.getElementById("volumeSlider").value = 0;
                } else {
                    muteBtn.innerHTML = "🔊 Sound: ON";
                    fullscreenMuteBtn.innerHTML = "🔊 Mute";
                    volume = 100;
                    document.getElementById("volumeSlider").value = 100;
                }

                // For games in same origin, we can control audio
                // For cross-origin games, we show visual feedback but can't control actual audio
                console.log(
                    "Audio " +
                        (isMuted ? "muted" : "unmuted") +
                        " (Visual feedback only for cross-origin games)",
                );

                // If you host the games yourself (same origin), you can uncomment this:
                // const iframe = document.getElementById('gameFrame');
                // if (iframe.contentWindow) {
                //     iframe.contentWindow.postMessage({
                //         type: 'SET_VOLUME',
                //         volume: isMuted ? 0 : volume
                //     }, '*');
                // }
            }

            // Volume slider control
            function updateVolume(value) {
                volume = parseInt(value);
                isMuted = volume === 0;

                const muteBtn = document.getElementById("muteBtn");
                const fullscreenMuteBtn =
                    document.getElementById("fullscreenMuteBtn");

                if (volume === 0) {
                    muteBtn.innerHTML = "🔇 Sound: OFF";
                    fullscreenMuteBtn.innerHTML = "🔇 Unmute";
                } else {
                    muteBtn.innerHTML = `🔊 ${volume}%`;
                    fullscreenMuteBtn.innerHTML = `🔊 ${volume}%`;
                }

                // For games in same origin, you can control volume here
                console.log("Volume set to:", volume + "%");
            }

            // Event Listeners
            document
                .getElementById("fullscreenBtn")
                .addEventListener("click", toggleFullscreen);
            document
                .getElementById("exitFullscreenBtn")
                .addEventListener("click", toggleFullscreen);
            document
                .getElementById("muteBtn")
                .addEventListener("click", toggleMute);
            document
                .getElementById("fullscreenMuteBtn")
                .addEventListener("click", toggleMute);

            document
                .getElementById("volumeSlider")
                .addEventListener("input", function (e) {
                    updateVolume(e.target.value);
                });

            // Restart game
            document
                .getElementById("restartBtn")
                .addEventListener("click", () => {
                    const gameFrame = document.getElementById("gameFrame");
                    const currentSrc = gameFrame.src;
                    gameFrame.src = "";
                    setTimeout(() => {
                        gameFrame.src = currentSrc;
                    }, 100);
                });

            // Keyboard shortcuts
            document.addEventListener("keydown", (e) => {
                // F for fullscreen
                if (e.key === "f" || e.key === "F") {
                    toggleFullscreen();
                    e.preventDefault();
                }
                // R for restart
                if (e.key === "r" || e.key === "R") {
                    document.getElementById("restartBtn").click();
                }
                // M for mute
                if (e.key === "m" || e.key === "M") {
                    toggleMute();
                    e.preventDefault();
                }
                // Escape to exit fullscreen
                if (e.key === "Escape" && isFullscreen) {
                    toggleFullscreen();
                    e.preventDefault();
                }
                // Arrow keys for volume
                if (e.key === "ArrowUp") {
                    volume = Math.min(100, volume + 10);
                    document.getElementById("volumeSlider").value = volume;
                    updateVolume(volume);
                    e.preventDefault();
                }
                if (e.key === "ArrowDown") {
                    volume = Math.max(0, volume - 10);
                    document.getElementById("volumeSlider").value = volume;
                    updateVolume(volume);
                    e.preventDefault();
                }
            });

            // Loading simulation
            window.addEventListener("load", () => {
                setTimeout(() => {
                    document.getElementById("loadingOverlay").style.opacity =
                        "0";
                    setTimeout(() => {
                        document.getElementById(
                            "loadingOverlay",
                        ).style.display = "none";
                    }, 500);

                    // Animate player counts
                    animateCounter("playCount", 2400000, 2500000, 2000);
                    animateCounter("playersOnline", 1248, 1350, 3000);
                }, 2000);
            });

            // Animate counter
            function animateCounter(elementId, start, end, duration) {
                const element = document.getElementById(elementId);
                let startTimestamp = null;

                const step = (timestamp) => {
                    if (!startTimestamp) startTimestamp = timestamp;
                    const progress = Math.min(
                        (timestamp - startTimestamp) / duration,
                        1,
                    );
                    const value = Math.floor(progress * (end - start) + start);
                    element.textContent = formatNumber(value);

                    if (progress < 1) {
                        window.requestAnimationFrame(step);
                    } else {
                        // Random fluctuation after animation
                        setInterval(() => {
                            const current = parseInt(
                                element.textContent.replace(/,/g, ""),
                            );
                            const fluctuation =
                                Math.floor(Math.random() * 100) - 50;
                            const newValue = Math.max(
                                start,
                                current + fluctuation,
                            );
                            element.textContent = formatNumber(newValue);
                        }, 5000);
                    }
                };

                window.requestAnimationFrame(step);
            }

            // Format number with commas
            function formatNumber(num) {
                return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }

            // Initialize particles
            document.addEventListener("DOMContentLoaded", () => {
                createIceParticles();

                // Handle resize for fullscreen
                window.addEventListener("resize", () => {
                    if (isFullscreen) {
                        // Adjust for mobile keyboards
                        if (window.innerHeight < window.innerWidth * 0.5) {
                            document.querySelector(
                                ".game-frame-container",
                            ).style.height = "100%";
                        }
                    }
                });

                // Handle visibility change
                document.addEventListener("visibilitychange", () => {
                    if (document.hidden && isFullscreen) {
                        // Optionally exit fullscreen when switching tabs
                        // toggleFullscreen();
                    }
                });
            });

            // ========== FIX FOR SAME-ORIGIN GAMES ==========
            // If you host games on your own server (same origin), you can use this:

            function setupGameControls() {
                const iframe = document.getElementById("gameFrame");

                // Wait for iframe to load
                iframe.onload = function () {
                    try {
                        // For same-origin iframes, we can access contentWindow
                        const gameWindow = iframe.contentWindow;

                        // Example: Listen for game events
                        window.addEventListener("message", function (event) {
                            if (event.source === gameWindow) {
                                console.log("Game message:", event.data);
                                // Handle game messages here
                            }
                        });

                        // Send initial volume
                        gameWindow.postMessage(
                            {
                                type: "SET_VOLUME",
                                volume: volume,
                            },
                            "*",
                        );
                    } catch (e) {
                        console.log(
                            "Cannot access iframe content (cross-origin)",
                        );
                    }
                };
            }

            // Uncomment this if you host games on your own server:
            // setupGameControls();
        </script>
    </body>
</html>
